<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة المشاريع</title>

  <style>
    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #d9e8fa;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    h1 {
      color: #23446b;
      margin: 10px 0;
    }

    button {
      background: #2878c7;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    input, select {
      padding: 12px;
      border: 1px solid #aaa;
      border-radius: 8px;
      font-size: 15px;
      flex: 1;
      min-width: 130px;
      background: white;
    }

    #projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .project {
      background: white;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      box-shadow: 0 2px 7px #00000015;
    }

    .project img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
    }

    .project h3 {
      color: #23446b;
    }

    .project p {
      color: #555;
      margin: 7px 0;
    }

    #message {
      text-align: center;
      color: #444;
      padding: 25px;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <header>
    <h1>قائمة المشاريع</h1>
    <button id="addButton">إضافة مشروع</button>
  </header>

  <div class="controls">
    <input
      type="text"
      id="search"
      placeholder="ابحث عن مشروع..."
      oninput="showProjects()"
    >

    <select id="category" onchange="showProjects()">
      <option value="">كل المواد</option>
    </select>

    <select id="grade" onchange="showProjects()">
      <option value="">كل الصفوف</option>
    </select>
  </div>

  <div id="message">جاري تحميل المشاريع...</div>
  <div id="projects"></div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@29.0.0"></script>
  <script src="auth.js"></script>

  <script>
    const client = new Appwrite.Client();

    client
      .setEndpoint("https://fra.cloud.appwrite.io/v1")
      .setProject("6afe09ed0002aa765acb");

    const tablesDB = new Appwrite.TablesDB(client);

    const DATABASE_ID = "6afe0a5d0038cf5cf776";
    const TABLE_ID = "6afe0a6f0007a901c6a1";

    let projects = [];

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    async function loadProjects() {
      const message = document.getElementById("message");
      const container = document.getElementById("projects");

      message.textContent = "جاري تحميل المشاريع...";
      container.innerHTML = "";

      try {
        const result = await tablesDB.listRows({
          databaseId: DATABASE_ID,
          tableId: TABLE_ID
        });

        projects = result.rows || [];

        updateFilters();
        showProjects();

      } catch (error) {
        console.error("Appwrite Error:", error);

        message.textContent =
          "فشل تحميل المشاريع: " + (error.message || "خطأ غير معروف");
      }
    }

    function updateFilters() {
      const categorySelect = document.getElementById("category");
      const gradeSelect = document.getElementById("grade");

      const categories = [...new Set(
        projects.map(p => p.subject).filter(Boolean)
      )];

      const grades = [...new Set(
        projects.map(p => p.grade).filter(Boolean)
      )];

      categorySelect.innerHTML =
        '<option value="">كل المواد</option>';

      gradeSelect.innerHTML =
        '<option value="">كل الصفوف</option>';

      categories.forEach(category => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        categorySelect.appendChild(option);
      });

      grades.forEach(grade => {
        const option = document.createElement("option");
        option.value = grade;
        option.textContent = grade;
        gradeSelect.appendChild(option);
      });
    }

    function showProjects() {
      const container = document.getElementById("projects");
      const message = document.getElementById("message");

      const search = document.getElementById("search")
        .value.toLowerCase().trim();

      const category = document.getElementById("category").value;
      const grade = document.getElementById("grade").value;

      container.innerHTML = "";

      const filtered = projects.filter(project => {
        const name = String(project.projectName || "").toLowerCase();
        const creator = String(project.creatorName || "").toLowerCase();

        return (
          (name.includes(search) || creator.includes(search)) &&
          (!category || project.subject === category) &&
          (!grade || project.grade === grade)
        );
      });

      if (filtered.length === 0) {
        message.textContent = projects.length === 0
          ? "لا توجد مشاريع حتى الآن."
          : "لم يتم العثور على مشاريع.";
        return;
      }

      message.textContent = "";

      filtered.forEach(project => {
        const card = document.createElement("div");
        card.className = "project";

        const image = project.imageUrl
          ? `<img src="${escapeHTML(project.imageUrl)}" alt="صورة المشروع">`
          : "";

        card.innerHTML = `
          ${image}
          <h3>${escapeHTML(project.projectName)}</h3>
          <p>صاحب المشروع: ${escapeHTML(project.creatorName)}</p>
          <p>المادة: ${escapeHTML(project.subject)}</p>
          <p>الصف: ${escapeHTML(project.grade)}</p>
          <p>التاريخ: ${escapeHTML(project.projectDate)}</p>
        `;

        card.onclick = function() {
          location.href = "project.html?id=" +
            encodeURIComponent(project.$id);
        };

        container.appendChild(card);
      });
    }

    loadProjects();
  </script>

</body>
</html>
