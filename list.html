<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة المشاريع</title>

  <style>
    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #d9e8fa;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    h1 {
      color: #23446b;
      margin: 10px 0;
    }

    button {
      background: #2878c7;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    input, select {
      padding: 12px;
      border: 1px solid #aaa;
      border-radius: 8px;
      font-size: 15px;
      flex: 1;
      min-width: 130px;
      background: white;
    }

    #projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .project {
      background: white;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      box-shadow: 0 2px 7px #00000015;
    }

    .project img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
    }

    .project h3 {
      color: #23446b;
    }

    .project p {
      color: #555;
      margin: 7px 0;
    }

    #message {
      text-align: center;
      color: #444;
      padding: 25px;
      font-size: 17px;
    }
  </style>
</head>
